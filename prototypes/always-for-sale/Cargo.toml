[package]
name = "always-for-sale"
version = "0.1.0"
edition = "2021"
description = "Rules core, bots and self-play CLI for the Always For Sale prototype (POC 7)"
license = "MIT"

[lib]
name = "afs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "afs-sim"
path = "src/bin/afs-sim.rs"

[dependencies]
rand_core = "0.6"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
