centre_selection: the 3 exploratory cells (of 128, seeds 1-50) that passed every point estimate
lines:
  tax_rate: 0.01
  rent: 0.1
  start_treasury: 5.0
line_levels: centre -2 .. +2 steps, clipped to the exploratory range
pairs_per_comparison: 1000
seeds: confirmatory seeds start at 1,000,000,000; exploratory used 1-50
bots: full = depth-2 alpha-beta over moves and buys, hedged pricing (HEDGE 0.4), stale-quote repricing;
  no_buy and rote ablations as in src/bot.rs at this tag
