_comment: Pre-registered before the confirmatory run (plans/poc-07, milestone 4). Do not edit after the
  tag afs-gate-a-prereg.
gate_a:
  gap_plies:
  - 6
  - 10
  gap_definition: median of pooled gaps, in plies (one player's action), between consecutive buyouts in
    full-vs-full self-play, counting the first gap from ply 0
  max_draw_share: 0.15
  draw_definition: ply cap, stalemate, insufficient material or mutual bankruptcy, in self-play
  min_win_rate: 0.6
  min_ci_lower: 0.55
  ci: 95% bootstrap over seed pairs (2,000 resamples)
  band_cells: 3
  band_definition: 3 adjacent passing cells on one line
